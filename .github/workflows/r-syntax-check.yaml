name: R syntax check

on:
  push:
  pull_request:

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R scripts
        run: Rscript -e 'files <- c(list.files("R", pattern="[.]R$", full.names=TRUE), "run_all.R", "app/app.R"); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files successfully.\n")'

